services:
  mosquitto:
    image: eclipse-mosquitto
    container_name: mosquitto
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf
    networks:
      lab2_net:
        aliases:
          - mosquitto
    restart: always

networks:
  lab2_net:
    external: true
